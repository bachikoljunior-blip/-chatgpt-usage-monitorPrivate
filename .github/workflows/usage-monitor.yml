name: ChatGPT usage monitor

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "USAGE.md"

permissions:
  contents: write

concurrency:
  group: chatgpt-usage-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reported, not gating — same fault as claude-usage-monitor.yml, same six-hour
      # blackout on 2026-08-11: a red assertion about codex/outbox skipped every step
      # below this one, so state/usage.json froze at 19:10Z. The job still goes red.
      - name: Test collector and encrypted vault
        id: tests
        continue-on-error: true
        run: node tests/run-tests.mjs

      - name: Require encrypted bootstrap secret
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "CODEX_AUTH_JSON is missing" >&2
            exit 1
          fi

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Restore latest authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: node scripts/auth-vault.mjs restore state/auth.vault "$HOME/.codex/auth.json"

      - name: Collect sanitized quota state
        id: collect
        continue-on-error: true
        run: node scripts/read-usage.mjs state/usage.json USAGE.md

      - name: Persist refreshed authentication securely
        if: always()
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: node scripts/auth-vault.mjs save state/auth.vault "$HOME/.codex/auth.json"

      - name: Verify no credentials entered public state
        if: always()
        run: node scripts/verify-sanitized-state.mjs state/usage.json

      - name: Commit current state
        if: always()
        run: |
          TARGET_BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}"
          git config user.name "chatgpt-usage-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/auth.vault state/usage.json USAGE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh sanitized ChatGPT usage state"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Propagate collection or test failure
        if: steps.collect.outcome != 'success' || steps.tests.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} collect=${{ steps.collect.outcome }}"
          exit 1
