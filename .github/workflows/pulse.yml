name: Pulse (ETA and heartbeats)

# The judgement half of the loop, kept in Actions rather than in a Claude lap.
#
# Actions minutes are not the scarce resource; the Claude weekly window is. Every
# computation that does not need judgement lives here, so that when the window is
# tight the target and the candidate list are still current and a lap only has to
# execute the top item. It also keeps observing through an outage that stops every
# lap, which is exactly when a stop-detector matters.

on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/compute-eta.mjs"
      - "scripts/check-heartbeats.mjs"
      - ".github/workflows/pulse.yml"

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compute ETA and check heartbeats
        id: compute
        run: |
          # BEFORE compute-eta, because compute-eta reads what this writes. It only
          # divides a committed snapshot — the fetch that produces that snapshot needs
          # cross-repo GitHub access, which a lap has and Actions does not. So this
          # goes red when the snapshot ages out, which is the correct alarm: the route
          # elected on reach is resting on a number nobody has refreshed. Allowed to
          # fail here for the same reason as the two below — a stale reach number must
          # not cost the ETA refresh — and the reporting step turns it red.
          node scripts/measure-reach.mjs --write || echo "reach check reported a problem; the reporting step fails on it"
          node scripts/compute-eta.mjs --write
          node scripts/check-heartbeats.mjs --write
          # Written here rather than in the reporting step below, which runs AFTER
          # the commit: a --write there produces a file that the next run's
          # `reset --hard` throws away, so the verdict would only ever be as fresh
          # as the last lap that ran it by hand. Deliberately not allowed to fail
          # the step — drift in the demo must not cost the ETA refresh, and the
          # reporting step below is what turns it red.
          node scripts/check-published-demo.mjs --write || echo "published demo check reported a problem; the reporting step fails on it"
          # Same shape, and deliberately allowed to fail here too: this one goes red
          # when a search observation gets stale, which must not cost the ETA refresh.
          node scripts/measure-findable-surface.mjs --write || echo "findable-surface check reported a problem; the reporting step fails on it"

      # fail closed, same as the collectors: a state file that failed its check
      # must never reach main.
      - name: Verify no credentials entered committed state
        id: verify
        run: |
          node scripts/verify-sanitized-state.mjs state/eta.json
          node scripts/verify-sanitized-state.mjs state/heartbeat.json
          node scripts/verify-sanitized-state.mjs state/eta-history.json
          node scripts/verify-sanitized-state.mjs state/public-host.json
          node scripts/verify-sanitized-state.mjs state/findable-surface.json
          node scripts/verify-sanitized-state.mjs state/youtube-scan.json
          node scripts/verify-sanitized-state.mjs state/external-metrics.json

      - name: Commit current state
        if: steps.compute.outcome == 'success' && steps.verify.outcome == 'success'
        run: |
          git config user.name "pulse[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated wholesale each run, so two overlapping runs always differ and
          # a rebase always conflicts. Reset to origin, regenerate, push.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/measure-reach.mjs --write || echo "reach check reported a problem"
            node scripts/verify-sanitized-state.mjs state/external-metrics.json || exit 1
            node scripts/compute-eta.mjs --write || exit 1
            node scripts/check-heartbeats.mjs --write || exit 1
            node scripts/verify-sanitized-state.mjs state/eta.json || exit 1
            node scripts/verify-sanitized-state.mjs state/heartbeat.json || exit 1
            node scripts/verify-sanitized-state.mjs state/eta-history.json || exit 1
            node scripts/check-published-demo.mjs --write || echo "published demo check reported a problem"
            node scripts/verify-sanitized-state.mjs state/public-host.json || exit 1
            node scripts/measure-findable-surface.mjs --write || echo "findable-surface check reported a problem"
            node scripts/verify-sanitized-state.mjs state/findable-surface.json || exit 1
            # The history has to be staged here or the scheduled run computes a
            # transition and then throws it away on the next reset --hard, leaving a
            # file that only ever records whatever a lap happened to run by hand.
            git add state/eta.json state/heartbeat.json state/eta-history.json state/public-host.json state/findable-surface.json
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -m "chore: refresh ETA and heartbeat state"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected, retrying ($attempt)"
          done
          echo "could not push after 3 attempts" >&2

      # Both of these lived only in RUNBOOK.md, which means they ran only when a
      # Claude lap remembered to run them — and laps stop exactly when the weekly
      # quota runs out. So the two checks that catch "a judgement came due and
      # nobody made it" and "the weekly round stopped happening" were guaranteed to
      # go quiet at the same moment they became true. Actions has its own budget and
      # keeps firing, so they belong here.
      #
      # Deliberately after the commit: a red run must not cost us the state refresh.
      # It reports by failing, because a report written into a file that only a lap
      # reads has the same defect as running only in the runbook.
      - name: Judgements owed and zero-base health
        if: always()
        run: |
          rc=0
          # Every file under state/ is supposed to pass the sanitizer. Only three were
          # ever checked here, so three shapes shipped that fail it outright:
          # gumroad-capabilities.json, then owner-requests.json (a forbidden key name),
          # then portfolio.json (no branch at all, so it fell through to the usage
          # shape). A file that fails is a file the credential scan never finishes on —
          # the opposite of what the rule exists for. Sweep them all instead of naming
          # a few, so a new shape cannot be silently exempt.
          for f in state/*.json; do
            node scripts/verify-sanitized-state.mjs "$f" || { echo "::error::$f fails the sanitizer"; rc=1; }
          done
          node scripts/check-predictions.mjs || rc=1
          node scripts/check-zerobase.mjs || rc=1
          node scripts/check-wiring.mjs || rc=1
          # The free artifact arrives by a lane commit, not by a lap running tests,
          # and the rule that opens the venue can be broken by any later edit to it.
          # Silent while the file is absent.
          node scripts/check-free-artifact.mjs || rc=1
          # The venue is handed a URL, and the rule above is enforced on a file in
          # this repository. If those two ever differ, the guard guards the copy
          # nobody can reach. No --write here: the writing copy runs before the
          # commit. This one only reports, which is what makes the run red.
          node scripts/check-published-demo.mjs || rc=1
          # Fails when a surveyed venue is carried as a route without saying whether
          # we can post from it. null is a legitimate answer; omission is not.
          node scripts/venue-readiness.mjs || rc=1
          # Published is not findable. This turns red when a page stops serving, or
          # when the only measurement of whether anything can FIND our public surface
          # has gone stale — which is the state it silently sat in for months.
          node scripts/measure-findable-surface.mjs || rc=1
          # The elected route rests on this number. It goes red when the snapshot ages
          # past 7 days or the day series stops yielding a rate — the two ways the reach
          # election is falsified by the world rather than by an argument. Only a lap
          # can refresh the snapshot (cross-repo read), so red here means "a lap owes a
          # fetch", not "the workflow is broken".
          node scripts/measure-reach.mjs || rc=1
          # A candidate may not claim its funnel is countable while a step of it has
          # no named reader. Added 2026-08-10, after the elected candidate was found
          # justifying itself with "clicks (measurable)" — a forecast in a
          # measurement's grammar, with nothing in the repository able to take it.
          # Red here means a candidate's claim has outrun its instruments.
          node scripts/funnel-check.mjs || rc=1
          # The two files laps EDIT BY HAND that the gate then reads. Nothing ran the
          # checker on either, and it showed: verify-sanitized-state kept its own copy
          # of the lap-claim kinds, never learned about route_change, and rejected every
          # row the gate had written for a day. A validator nobody invokes is the same
          # defect as a rule that lives only in a runbook.
          node scripts/verify-sanitized-state.mjs state/lap-claims.json || rc=1
          node scripts/verify-sanitized-state.mjs state/constraints.json || rc=1
          # A standing owner directive must keep refusing the work it forbids. The
          # registry recorded A2 correctly for a day while nothing read the `blocks`
          # field, and in that window the forbidden candidate ranked FIRST. The
          # assertions live in the suite because they are pure; they run here because a
          # guard that only fires when a lap remembers to run tests is the same defect
          # as a rule that lives only in a runbook.
          node tests/run-tests.mjs >/dev/null || rc=1
          if [ "$rc" != "0" ]; then
            echo "::error::something is owed or the zero-base round has stalled — see the output above"
          fi
          exit $rc
          exit 1
