name: "Claude token 2: submit the code"

# The other half of the phone-only setup. One input, so there is nothing to
# choose wrong: paste the code from the authorization page and run.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "承認後に表示されたコードを貼り付けてください"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: claude-usage-monitor
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require the vault key
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON is missing; it is the vault's key material"
            exit 1
          fi

      - name: Exchange the code for a token
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          PASTED_CODE: ${{ inputs.code }}
        run: node scripts/claude-token-setup.mjs finish "$PASTED_CODE"

      - name: Refresh usage with the new token
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          node scripts/read-claude-usage.mjs state/claude-usage.json CLAUDE_USAGE.md
          node scripts/verify-sanitized-state.mjs state/claude-usage.json

      - name: Commit the encrypted vault and the refreshed state
        if: always()
        run: |
          git config user.name "claude-usage-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state CLAUDE_USAGE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: store the Claude token and refresh usage"
          bash scripts/push-with-retry.sh
