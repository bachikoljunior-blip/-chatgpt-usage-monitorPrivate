name: Claude usage monitor

on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "USAGE.md"
      - "CLAUDE_USAGE.md"

permissions:
  contents: write

concurrency:
  group: claude-usage-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reported, not gating. 2026-08-11T19:11Z an unledgered answer landed in
      # codex/outbox and turned this suite red; the step had no continue-on-error,
      # so "Collect sanitized Claude quota state" was SKIPPED on every run for the
      # next six hours and state/claude-usage.json froze at 19:02Z. The pacing gate
      # is the only branch point in the loop and it divides the frozen number.
      # A content assertion about a different file must not be able to stop the
      # meter that feeds the gate. The job still goes red — see the last step.
      - name: Test collectors
        id: tests
        continue-on-error: true
        run: node tests/run-tests.mjs

      - name: Warn when the subscription token is not configured yet
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ ! -f state/claude-token.vault ]; then
            echo "::warning::No Claude token yet; run the 'Claude token setup' workflow"
          fi

      - name: Collect sanitized Claude quota state
        id: collect
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: node scripts/read-claude-usage.mjs state/claude-usage.json CLAUDE_USAGE.md

      - name: Verify no credentials entered committed state
        if: always()
        run: node scripts/verify-sanitized-state.mjs state/claude-usage.json

      - name: Commit current state
        if: always()
        run: |
          TARGET_BRANCH="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}"
          git config user.name "claude-usage-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A over the directory: the vault is rewritten whenever the access
          # token is refreshed, and it does not exist before setup runs.
          git add -A state CLAUDE_USAGE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh sanitized Claude usage state"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Propagate collection or test failure
        if: steps.collect.outcome != 'success' || steps.tests.outcome != 'success'
        run: |
          echo "tests=${{ steps.tests.outcome }} collect=${{ steps.collect.outcome }}"
          exit 1
