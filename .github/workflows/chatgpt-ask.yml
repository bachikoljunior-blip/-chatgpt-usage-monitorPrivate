name: Ask ChatGPT

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Question or instruction to send to ChatGPT"
        required: true
        type: string
      model:
        description: "Model override (blank uses the account default)"
        required: false
        default: ""
        type: string
      force:
        description: "Run even when the quota mode is reserve"
        required: false
        default: false
        type: boolean
      collect_files:
        description: "Let the run write files and commit what it produced to state/answers/files"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Shared with the usage monitor so the encrypted vault is never written concurrently.
concurrency:
  group: chatgpt-usage-monitor
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The dispatched ref is used, not a pinned `main`, so a change to this workflow or to
      # scripts/ask-chatgpt.mjs can be exercised on a branch before it reaches main. The
      # answer is committed back to whichever ref was dispatched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require encrypted bootstrap secret
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "CODEX_AUTH_JSON is missing" >&2
            exit 1
          fi

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Ask ChatGPT
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
          FORCE: ${{ inputs.force }}
          COLLECT_FILES: ${{ inputs.collect_files }}
        run: |
          mkdir -p state/answers
          printf '%s' "$PROMPT" > "$RUNNER_TEMP/prompt.txt"
          ARGS=(--file "$RUNNER_TEMP/prompt.txt"
                --out state/answers/latest.md
                --record state/answers/latest.json
                --persist-vault)
          if [ -n "$MODEL" ]; then ARGS+=(--model "$MODEL"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          # The run stays read-only. Codex cannot unshare a network namespace on a hosted
          # runner (`bwrap: loopback: Failed RTM_NEWADDR`), so a writable sandbox never
          # starts; the files ride back inside the answer instead and the runner writes them.
          if [ "$COLLECT_FILES" = "true" ]; then
            rm -rf state/answers/files
            ARGS+=(--emit-files state/answers/files)
          fi
          node scripts/ask-chatgpt.mjs "${ARGS[@]}" > "$RUNNER_TEMP/answer.txt"

      - name: Summarize the files the run produced
        if: always() && inputs.collect_files
        run: |
          if [ -d state/answers/files ]; then
            {
              echo
              echo "### Files produced"
              echo
              ls -la state/answers/files
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the answer to the run summary
        if: always()
        run: |
          {
            echo "## ChatGPT answer"
            echo
            if [ -s "$RUNNER_TEMP/answer.txt" ]; then
              cat "$RUNNER_TEMP/answer.txt"
            else
              echo "No answer was produced; see the step logs for the failure code."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify no credentials entered committed state
        if: always()
        run: |
          # Emitted files are carved out of the already-redacted answer, so this is a backstop.
          if [ -d state/answers/files ] && grep -rIlE 'sk-[A-Za-z0-9_-]{16,}|Bearer[[:space:]]+[A-Za-z0-9._-]{16,}' state/answers/files; then
            echo "credential-shaped text reached an emitted file" >&2
            exit 1
          fi
          if [ -f state/answers/latest.json ]; then
            node scripts/verify-sanitized-state.mjs state/answers/latest.json
          fi

      - name: Commit the answer and refreshed authentication
        if: always()
        run: |
          git config user.name "chatgpt-usage-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/auth.vault state/answers
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record ChatGPT answer"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
