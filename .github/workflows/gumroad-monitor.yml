name: Gumroad sales monitor

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      probe_create:
        description: "Also probe whether the API can create products (non-mutating)"
        type: boolean
        default: false
      probe_lifecycle:
        description: "Create a draft product, read it back, then delete it. Mutating but self-cleaning; decides whether listing needs a person at all."
        type: boolean
        default: false
      probe_recurring:
        description: "Create a monthly membership draft, read back whether it is really recurring, then delete it. Settles whether the RECURRING form the elected route needs can be listed without a person, which the one-time lifecycle probe never answered."
        type: boolean
        default: false
      probe_cover:
        description: "Probe whether a cover image can be set through the API. Reads, plus two writes that carry no real product fields and cannot succeed into a bad state. Re-run to detect the day Gumroad adds the route."
        type: boolean
        default: false
      probe_file_replacement:
        description: "Probe whether the FILE A BUYER DOWNLOADS can be replaced over the API. Runs entirely against a throwaway product it creates and deletes; never writes to the live listing. Decides whether any source fix to the priced product is deliverable at all."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/read-gumroad.mjs"
      - ".github/workflows/gumroad-monitor.yml"

permissions:
  contents: write

concurrency:
  group: gumroad-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require the Gumroad secret
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          if [ -z "$GUMROAD_TOKEN" ]; then
            echo "GUMROAD_TOKEN is missing from repository secrets" >&2
            exit 1
          fi

      - name: Collect sanitized sales state
        id: collect
        continue-on-error: true
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: node scripts/read-gumroad.mjs state/gumroad.json

      # fail closed。2026-08-08、この検査が落ちているのにコミットが
      # if: always() で走り、**検査に落ちた状態ファイルがそのまま main に載った。**
      # 資格情報を守る検査が、守らないまま通過を許す形になっていた。
      - name: Verify no credentials entered committed state
        id: verify
        run: node scripts/verify-sanitized-state.mjs state/gumroad.json state/gumroad-history.json

      - name: Probe the full create/read/delete lifecycle
        if: always() && inputs.probe_lifecycle
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          node scripts/probe-gumroad-lifecycle.mjs state/gumroad-capabilities.json
          node scripts/verify-sanitized-state.mjs state/gumroad-capabilities.json
          # The commit step below resets to origin/main before staging, which would
          # delete this file seconds after it was written. 2026-08-09: the first
          # dispatch did exactly that — the run went green and nothing changed,
          # which reads as "the probe found nothing" rather than "the result was
          # discarded". Park it outside the working tree so the reset cannot reach it.
          cp state/gumroad-capabilities.json "$RUNNER_TEMP/gumroad-capabilities.json"

      # Kept behind a dispatch input rather than put on the schedule: it creates a
      # real product, and Gumroad caps creates at ten a day. An hourly probe would
      # spend that cap on a question whose answer changes rarely, and would leave
      # nothing for the run that actually lists something.
      - name: Probe whether a RECURRING offer can be listed over the API
        if: always() && inputs.probe_recurring
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          node scripts/probe-gumroad-recurring.mjs state/gumroad-recurring.json
          node scripts/verify-sanitized-state.mjs state/gumroad-recurring.json
          # Same reason as the lifecycle probe above: the commit step resets to
          # origin/main before staging and would delete this seconds after it was
          # written, which reads as "the probe found nothing".
          cp state/gumroad-recurring.json "$RUNNER_TEMP/gumroad-recurring.json"

      # HOURLY, not behind a dispatch input. This is the only instrument that can
      # see the seller replace the attachment, and it spent its whole life behind
      # a checkbox: a success test naming it waits for a lap to remember, then
      # fails open at judge_by and records the owner as not having acted. That
      # nearly happened to 2026-08-09.gumroad-cover-upload, and on 2026-08-10 it
      # was the ONLY live clause left on the open request — the cheap hourly
      # alternative, file_info.Size, comes back as a human-formatted string
      # ("31.7 KB"), so the byte-count clause reading it is null forever.
      #
      # --into a disposable directory, NOT product/. This downloads what a buyer
      # gets today; product/ is where laps fix it before it ships. Sharing the
      # path was harmless at one run a week and reverts every fix at one an hour.
      # Only the manifest is kept, which is the whole instrument.
      #
      # continue-on-error because the sales collection above must not go red over
      # a signed-URL hiccup: this step is an addition to that run, not a
      # precondition for it.
      - name: Recover the sold product's manifest from its own attachment
        continue-on-error: true
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          node scripts/fetch-product-source.mjs --write --into="$RUNNER_TEMP/product-source-extract"
          node scripts/verify-sanitized-state.mjs state/product-source.json
          cp state/product-source.json "$RUNNER_TEMP/product-source.json"

      - name: Probe whether products can be created over REST
        if: always() && inputs.probe_create
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: node scripts/probe-gumroad-create.mjs

      # Writes nothing to state on purpose. The answer lives in
      # state/constraints.json listing_has_no_cover_image, which the ranking
      # already reads; a second state file would only be another place for the
      # same fact to go stale. This step exists so the measurement can be
      # repeated without a lap, since "no such route" is exactly the kind of
      # thing that silently stops being true.
      - name: Probe whether a cover image can be set over REST
        if: always() && inputs.probe_cover
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: node scripts/probe-gumroad-cover.mjs

      # This one DOES write state, unlike the cover probe above, and the reason
      # is the difference between the two answers. The cover answer was consumed
      # once, by a lap, and turned into an owner request. This answer is a
      # standing precondition: promise_conformance on the priced product is
      # unreachable while the delivered file is frozen, so every later lap has to
      # know it without re-probing. scripts/promise-conformance.mjs reads the
      # file and derives its observation from the verdict rather than asserting
      # it in prose — which is what it did before this existed, and it was
      # asserting something nobody had measured.
      - name: Probe whether the delivered file can be replaced over REST
        if: always() && inputs.probe_file_replacement
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          node scripts/probe-gumroad-file-replacement.mjs state/gumroad-file-replacement.json
          node scripts/verify-sanitized-state.mjs state/gumroad-file-replacement.json
          # Same reason as the recurring probe: the commit step resets to
          # origin/main before staging and would delete this seconds after it
          # was written, which reads as "the probe found nothing".
          cp state/gumroad-file-replacement.json "$RUNNER_TEMP/gumroad-file-replacement.json"

      # always(), and deliberately AFTER the probe's own `set -e` can kill the
      # step above. The probe exits 1 when it cannot delete its throwaway, which
      # is correct reporting and is not cleanup — on 2026-08-10T10:38Z that is
      # exactly what happened (DELETE answered HTTP 502) and a product was left
      # on a live storefront. A probe cannot be its own recovery, because the
      # case needing recovery is the probe failing.
      - name: Sweep any probe product left on the account
        if: always() && inputs.probe_file_replacement
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: node scripts/sweep-gumroad-probe-products.mjs

      - name: Commit current state
        if: steps.collect.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
        run: |
          git config user.name "gumroad-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state/gumroad.json は毎回まるごと生成される。二つの実行が重なると
          # 内容が必ず食い違うので、rebase すると必ず衝突する（2026-08-08 に実際に起きた）。
          # 生成物に履歴の統合は要らない。origin に合わせ直して、作り直して、載せ直す。
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/read-gumroad.mjs state/gumroad.json || exit 1
            node scripts/verify-sanitized-state.mjs state/gumroad.json state/gumroad-history.json || exit 1
            # Restore anything a probe produced before the reset above removed it.
            #
            # This was a per-file `if` for gumroad-capabilities.json alone, while
            # three probes copied their output to RUNNER_TEMP citing this exact
            # reset as the reason. Two of them — the recurring probe and the
            # product-source fetch — were never restored and never staged, so a
            # dispatched run threw its own answer away and reported no change.
            # Both files are in the repository only because laps committed them
            # by hand afterwards, which is why nobody noticed. Named as a list so
            # adding a probe cannot half-wire itself the same way again.
            for probe_state in \
              gumroad-capabilities \
              gumroad-recurring \
              gumroad-file-replacement \
              product-source
            do
              if [ -f "$RUNNER_TEMP/$probe_state.json" ]; then
                cp "$RUNNER_TEMP/$probe_state.json" "state/$probe_state.json"
              fi
              git add "state/$probe_state.json" 2>/dev/null || true
            done
            git add state/gumroad.json
            # The dated series. state/gumroad.json is regenerated whole every run and
            # carries only the latest snapshot, which is why the ETA could never see a
            # rate. gumroad-history.json is the append-only half, and staging it is the
            # entire point: the reset --hard above reloads it from origin, so a run that
            # appends without committing throws the reading away and the series stays
            # one row long forever.
            git add state/gumroad-history.json
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -m "chore: refresh sanitized Gumroad sales state"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected, retrying ($attempt)"
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      - name: Propagate collection failure
        if: steps.collect.outcome != 'success'
        run: exit 1
