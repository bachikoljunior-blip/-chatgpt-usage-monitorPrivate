name: Run the ChatGPT inbox

# The lane that spends the other quota pool.
#
# 2026-08-09: the Claude weekly window was at 42% with three live hourly loops
# claiming 75% of what was left, while the Codex weekly window sat at 100% —
# untouched, because nothing dispatched it. codex/INBOX.md, the transport, and
# the answer-committing all already existed; only the schedule was missing, and
# state/automations.json recorded the gap as "owner starts it by hand".
#
# The prompt here is one line on purpose. Instructions live in codex/INBOX.md,
# so changing the work never means editing a workflow — a prompt with facts in
# it goes stale the moment the repository moves and then hands out lies.

on:
  schedule:
    # Hourly, minute 41 — clear of usage-monitor at :07 and claude-usage-monitor
    # at :22, both of which share this workflow's concurrency group.
    #
    # It was daily until 2026-08-09, on the reasoning that surveys of the outside
    # world do not change hour to hour. True, and beside the point: what changes
    # hour to hour is the QUESTION. A lap that needs an outside answer writes it
    # into codex/INBOX.md and then cannot proceed until this workflow runs, so a
    # daily cron prices every external question at up to a day of latency on the
    # one lane that can see outside at all.
    #
    # The measurement that settled it: all ten runs in this workflow's entire
    # history were workflow_dispatch. The daily cron had delivered zero answers.
    # Every answer the loop ever got came from a lap that happened to have MCP
    # tools available, and RUNBOOK step 0 records that MCP presence varies run to
    # run — so the lane's throughput was a coin flip dressed as a schedule.
    #
    # Hourly is affordable because the skip is cheap: inbox-task.mjs decides
    # before any model runs, and a task that already carries its done marker
    # costs a checkout and a node process. It does not re-run a finished survey.
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the done_marker already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Shared with the usage monitor so the encrypted vault is never written twice at once.
concurrency:
  group: chatgpt-usage-monitor
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide whether the inbox task should run
        id: task
        run: node scripts/inbox-task.mjs >> "$GITHUB_OUTPUT"

      - name: Say why the run is being skipped
        if: steps.task.outputs.run != 'true' && !inputs.force
        run: |
          echo "## Inbox skipped" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.task.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "queue depth: ${{ steps.task.outputs.queue_depth }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Require encrypted bootstrap secret
        if: steps.task.outputs.run == 'true' || inputs.force
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "CODEX_AUTH_JSON is missing" >&2
            exit 1
          fi

      - name: Install Codex CLI
        if: steps.task.outputs.run == 'true' || inputs.force
        run: npm install --global @openai/codex@0.147.0

      # The account has TWO weekly Codex pools and this lane was only ever able to
      # spend one of them. `codex exec` with no --model runs the account default,
      # and the default is not Spark — so state/usage.json showed the Spark window
      # at 100% for the lane's entire history while the other one burned, and the
      # ETA reasoning kept calling that untouched pool "spare capacity". It was
      # not spare. It was unreachable, because nothing named it.
      #
      # The slug is derived from the meter's own limit_name rather than typed in
      # here, so a rename upstream does not leave a stale string behind.
      - name: Work out which model spends the Spark pool
        id: spark
        if: steps.task.outputs.run == 'true' || inputs.force
        run: node scripts/spark-model.mjs >> "$GITHUB_OUTPUT"

      - name: Hand the inbox to ChatGPT
        if: steps.task.outputs.run == 'true' || inputs.force
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          SPARK_MODEL: ${{ steps.spark.outputs.spark_model }}
        run: |
          mkdir -p state/answers
          # The prompt carries the INBOX and the state files it references,
          # assembled here from the checkout. codex runs outside the checkout on
          # purpose, so "go read the file" reaches nothing — the first live run
          # proved it by answering "the working directory is empty". Read fresh
          # every run, so nothing attached can be staler than the run.
          node scripts/inbox-task.mjs --prompt-out "$RUNNER_TEMP/prompt.txt"
          # danger-full-access: the default read-only sandbox cannot start on this
          # runner (bwrap "loopback: Failed RTM_NEWADDR"), and a model that cannot
          # run a command answers from the prompt alone — which for a task that is
          # entirely "go read the outside world" means an invented answer. The
          # runner is a throwaway VM and the vault is deleted by the script.
          ask() {
            node scripts/ask-chatgpt.mjs \
              --file "$RUNNER_TEMP/prompt.txt" \
              --out state/answers/latest.md \
              --record state/answers/latest.json \
              --sandbox danger-full-access \
              --persist-vault "$@" > "$RUNNER_TEMP/answer.txt"
          }
          # Ask for Spark, and fall back to the account default if that name is
          # not one the CLI accepts. The slug is a hypothesis derived from the
          # meter, and this is what makes being wrong about it cheap: an unknown
          # model fails before any quota is spent, so the worst case is today's
          # behaviour plus one wasted second. Which pool a named run actually
          # spends is then settled by which window moves in the next usage
          # reading — measured, not argued.
          if [ -n "$SPARK_MODEL" ]; then
            if ask --model "$SPARK_MODEL"; then
              echo "asked with --model $SPARK_MODEL" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "--model $SPARK_MODEL was refused; retrying on the account default" >> "$GITHUB_STEP_SUMMARY"
              ask
            fi
          else
            echo "no Spark window in the current usage reading; asked on the account default" >> "$GITHUB_STEP_SUMMARY"
            ask
          fi

      - name: Leave the done marker
        if: steps.task.outputs.run == 'true' || inputs.force
        env:
          MARKER: ${{ steps.task.outputs.done_marker }}
        run: |
          # "Non-empty" is not "done". The first live run answered in one sentence
          # that it could not find the INBOX, and that sentence was non-empty
          # enough to earn a marker that would have suppressed every run until
          # valid_until. The task declares done_signal; the answer has to carry it.
          if [ -z "$MARKER" ]; then
            echo "no done_marker declared; not marking" >> "$GITHUB_STEP_SUMMARY"
          elif node scripts/inbox-task.mjs --earned state/answers/latest.md; then
            mkdir -p "$(dirname "$MARKER")"
            cp state/answers/latest.md "$MARKER"
            echo "marker written: $MARKER" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "answer did not carry the task's done_signal; no marker, so this task runs again" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Every run leaves this mark, including the ones that skipped. The lane's
      # liveness used to be read from state/answers/latest.json, which only moves
      # when a question is actually put — so once the schedule became hourly, a
      # healthy idle lane would have looked identical to a stopped one.
      - name: Record that the lane ran
        if: always()
        # Through the environment rather than inlined into the script: the reason
        # string is free text from inbox-task.mjs and would otherwise be pasted
        # into a shell command.
        env:
          RAN: ${{ (steps.task.outputs.run == 'true' || inputs.force) && 'true' || 'false' }}
          TASK_ID: ${{ steps.task.outputs.task_id }}
          REASON: ${{ steps.task.outputs.reason }}
        run: |
          node scripts/record-lane-run.mjs \
            --ran="$RAN" --task="$TASK_ID" --reason="$REASON"
          node scripts/verify-sanitized-state.mjs state/codex-lane.json

      - name: Publish the answer to the run summary
        if: always() && (steps.task.outputs.run == 'true' || inputs.force)
        run: |
          {
            echo "## ChatGPT answer"
            echo
            if [ -s "$RUNNER_TEMP/answer.txt" ]; then
              cat "$RUNNER_TEMP/answer.txt"
            else
              echo "No answer was produced; see the step logs for the failure code."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify no credentials entered committed state
        if: always() && (steps.task.outputs.run == 'true' || inputs.force)
        run: |
          if [ -f state/answers/latest.json ]; then
            node scripts/verify-sanitized-state.mjs state/answers/latest.json
          fi

      # Unconditional, unlike the steps above: a skipped run has nothing to say
      # about the inbox but still has to publish the fact that it happened, or
      # the schedule is unwatchable again.
      - name: Commit the answer, the marker, the lane mark, and refreshed authentication
        if: always()
        run: |
          git config user.name "chatgpt-usage-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/auth.vault state/answers state/codex-lane.json codex
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record the ChatGPT inbox run"
          git pull --rebase origin main
          git push origin HEAD:main
